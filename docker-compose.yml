# TCI AI landing page.
#   cp .env.example .env    # then set NEXT_PUBLIC_SITE_URL (required)
#   docker compose up -d --build
# Serves on http://127.0.0.1:${PORT:-8080} only. Put a TLS reverse proxy in front on a
# server (see DEPLOY.md); Docker-published ports bypass host firewalls such as ufw.
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in .env to the public https origin (http://localhost:8080 for a local test)}
        NEXT_PUBLIC_WORKSPACE_URL: ${NEXT_PUBLIC_WORKSPACE_URL:-}
    image: tci-ai-landing:latest
    container_name: tci-ai-landing
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8080}:3000"
    environment:
      THAIJO_STATS_URL: ${THAIJO_STATS_URL:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
